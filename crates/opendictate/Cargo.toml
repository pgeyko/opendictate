[package]
name = "opendictate"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "opendictate"
path = "src/main.rs"

[dependencies]
opendictate-core = { path = "../opendictate-core" }
opendictate-stt = { path = "../opendictate-stt" }
opendictate-input = { path = "../opendictate-input" }
opendictate-tray = { path = "../opendictate-tray" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
evdev = "0.12"
ksni = { version = "0.3", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
