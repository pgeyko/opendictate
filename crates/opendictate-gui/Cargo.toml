[package]
name = "opendictate-gui"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "opendictate-gui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gtk = { package = "gtk4", version = "0.9" }
adw = { package = "libadwaita", version = "0.7" }
libc = "0.2"
